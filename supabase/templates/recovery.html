<!doctype html>
<html lang="es">
  <body style="margin:0;padding:24px;background:#0a0f1c;font-family:Inter,Arial,sans-serif;color:#e8eef9">
    <table role="presentation" width="100%" style="max-width:480px;margin:0 auto;background:#111a2e;border-radius:16px;padding:32px">
      <tr><td>
        <p style="margin:0 0 8px;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#4d8dff;font-weight:700">FUTBOLEROS</p>
        <h1 style="margin:0 0 16px;font-size:24px">Creá una nueva contraseña</h1>
        <p style="margin:0 0 24px;line-height:1.5;color:#a9b5cc">Recibimos un pedido para recuperar tu acceso. El link vence en una hora.</p>
        <p style="margin:0 0 24px"><a href="{{ .RedirectTo }}&token_hash={{ .TokenHash }}&type=recovery" style="display:inline-block;background:#2f7cff;color:#fff;text-decoration:none;font-weight:600;padding:12px 20px;border-radius:12px">Elegir nueva contraseña</a></p>
        <p style="margin:0;font-size:12px;color:#7d8aa3">Si no lo pediste, ignorá este email: tu contraseña no cambia.</p>
      </td></tr>
    </table>
  </body>
